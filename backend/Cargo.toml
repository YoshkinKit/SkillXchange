[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.9.0"
actix-files = "0.6.6"
actix-web-httpauth = "0.8.2"
sqlx = {version = "0.8.2", features = ["postgres", "runtime-async-std", "tls-native-tls", "chrono", "derive"]}
serde = {version = "1.0.215", features = ["derive"]}
chrono = { version = "0.4.38", features = ["serde"] }
jsonwebtoken = "9.3.0"
futures = "0.3.31"
bcrypt = "0.16.0"
serde_json = "1.0.133"
time = { version = "0.3.37", features = ["serde"] }
env_logger = "0.11.5"
futures-util = "0.3.31"