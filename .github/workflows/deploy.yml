name: CI and Deploy to Heroku

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Установка Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Установить переменные окружения
      run: |
        echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/test_db" >> $GITHUB_ENV
        echo "ACCESS_TOKEN_SECRET=test_secret_key" >> $GITHUB_ENV
        echo "REFRESH_TOKEN_SECRET=test_refresh_secret_key" >> $GITHUB_ENV
        echo "PORT=8000" >> $GITHUB_ENV
    
    - name: Применить миграции
      working-directory: backend
      run: |
        cargo install sqlx-cli --no-default-features --features native-tls,postgres
        sqlx database create
        sqlx migrate run

    - name: Сборка
      working-directory: backend
      run: cargo build --verbose

    - name: Запуск тестов
      working-directory: backend
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
        ACCESS_TOKEN_SECRET: test_secret_key
        REFRESH_TOKEN_SECRET: test_refresh_secret_key
        PORT: 8000
      run: cargo test --verbose

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      # Сборка фронтенда
      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Установка зависимостей фронтенда
        working-directory: frontend
        run: npm install

      - name: Сборка фронтенда
        working-directory: frontend
        run: npm run build

      # Сборка бэкенда
      - name: Установка Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Сборка бэкенда
        working-directory: backend
        run: cargo build --release

      # Деплой на Heroku
      - name: Деплой на Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: 'skillxchange'
          heroku_email: '10252126@stud.op.edu.ua'
          usedocker: true